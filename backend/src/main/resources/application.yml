server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: keystone
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/keystone_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  security:
    user:
      name: admin
      password: ${INITIAL_ADMIN_PASSWORD:admin123}

keystone:
  jwt:
    secret: ${JWT_SECRET:WEYN2/9hxem8JPQ14rA6/fGAJVG31btpBYIgh6aODYF7LMpGLgqzifYn6V6P7/HLwR4PKuht4bpgRf/qNIlSSQ==}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  sla:
    low-hours: 72
    medium-hours: 24
    high-hours: 8
    critical-hours: 2
  work-order:
    code-prefix: "WO"
  pagination:
    default-page-size: 20
    max-page-size: 100

logging:
  level:
    com.vertexa.keystone: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true