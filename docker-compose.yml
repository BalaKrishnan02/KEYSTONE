version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: keystone-db
    environment:
      POSTGRES_DB: keystone
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: keystone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: keystone-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/keystone
      DB_USERNAME: keystone
      DB_PASSWORD: keystone
      JWT_SECRET: ${JWT_SECRET:-WEYN2/9hxem8JPQ14rA6/fGAJVG31btpBYIgh6aODYF7LMpGLgqzifYn6V6P7/HLwR4PKuht4bpgRf/qNIlSSQ==}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: keystone-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
